{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.platform_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f0f0ff; }
        .main-section { background-color: #E6E6FA; padding: 60px 0; min-height: 500px; }
        .tab-main { border: 2px solid #4b0082; color: #4b0082; border-radius: 50px; padding: 10px 40px; font-weight: bold; background: white; transition: 0.3s; }
        .tab-main:hover, .tab-main.active { background: #4b0082; color: white; }
        .sub-tabs-container { display: none; margin-top: 25px; animation: slideDown 0.4s ease; }
        .btn-sub { border-radius: 20px; padding: 5px 25px; font-size: 0.9rem; margin: 5px; background-color: #2D5A27; color: white; border: none; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .stat-card { background: white; border-radius: 20px; padding: 30px; border-bottom: 8px solid #4b0082; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

{% include "core/header.html" %}

<div class="main-section text-center">
    <div class="container">
        <h1 class="fw-bold mb-5">مرحباً بكِ في منصة التدريب</h1>

        <div class="d-flex justify-content-center gap-3 flex-wrap mb-4">
            <button class="btn tab-main" onclick="toggleTabs('qodrat', this)">قسم القدرات</button>
            <button class="btn tab-main" onclick="toggleTabs('tahsili', this)">قسم التحصيلي</button>
            <button class="btn tab-main" style="border-color: #333; color: #333;">طباعة المحتوى 🖨️</button>
        </div>

        <div id="qodrat-area" class="sub-tabs-container">
            <button class="btn btn-sub">الكمي</button>
            <button class="btn btn-sub">اللفظي</button>
        </div>

        <div id="tahsili-area" class="sub-tabs-container">
            <button class="btn btn-sub">الرياضيات</button>
            <button class="btn btn-sub">الأحياء</button>
            <button class="btn btn-sub">الكيمياء</button>
            <button class="btn btn-sub">الفيزياء</button>
        </div>

        <div class="row g-4 mt-5">
            <div class="col-md-4">
                <div class="stat-card">
                    <h2 class="fw-bold text-primary">25</h2>
                    <p class="text-muted">عدد الدروس 📘</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <h2 class="fw-bold text-primary">120</h2>
                    <p class="text-muted">عدد الأمثلة 📝</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <h2 class="fw-bold text-primary">5</h2>
                    <p class="text-muted">اختبارات محاكية ⏱️</p>
                </div>
            </div>
        </div>
    </div>
</div>

{% include "core/footer.html" %}

<script>
    function toggleTabs(section, btn) {
        // إخفاء جميع التبويبات الفرعية
        document.getElementById('qodrat-area').style.display = 'none';
        document.getElementById('tahsili-area').style.display = 'none';
        
        // إزالة حالة النشاط من الأزرار
        document.querySelectorAll('.tab-main').forEach(b => b.classList.remove('active'));
        
        // إظهار القسم المطلوب 
        document.getElementById(section + '-area').style.display = 'block';
        btn.classList.add('active');
    }
</script>

</body>
</html>
