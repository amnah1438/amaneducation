{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.platform_name }}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --lavender-bg: #E6E6FA; --deep-purple: #4b0082; }
        body { font-family: 'Tajawal', sans-serif; background-color: #f8f9ff; margin: 0; padding: 0; }
        
        /* زر السندويش (لوحة الإدارة) - أعلى اليمين */
        .admin-burger { position: fixed; top: 15px; right: 20px; z-index: 2000; }
        
        .hero-section { background-color: var(--lavender-bg); padding: 80px 0; min-height: 450px; }
        
        /* أزرار التبويبات الرئيسية */
        .tab-main { border: 2px solid var(--deep-purple); color: var(--deep-purple); border-radius: 50px; padding: 12px 45px; font-weight: bold; background: white; transition: 0.3s; margin: 5px; }
        .tab-main:hover, .tab-main.active { background: var(--deep-purple); color: white; }
        
        /* أزرار التبويبات الفرعية */
        .sub-tabs-box { display: none; margin-top: 25px; animation: fadeIn 0.4s ease; }
        .btn-sub { border-radius: 20px; padding: 6px 30px; font-size: 0.95rem; margin: 5px; background-color: #2D5A27; color: white; border: none; }

        .stat-card { background: white; border-radius: 20px; padding: 35px; border-bottom: 8px solid var(--deep-purple); box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="admin-burger">
        <a href="/admin/" class="btn btn-dark shadow-lg px-4 py-2 rounded-pill">
            <span class="me-2">☰</span> لوحة الإدارة
        </a>
    </div>

    {% include "core/header.html" %}

    <main class="hero-section text-center">
        <div class="container">
            <h1 class="fw-bold mb-5">مرحبًا بكِ في منصة التدريب</h1>

            <div class="d-flex justify-content-center flex-wrap mb-4">
                <button class="btn tab-main" onclick="toggleTabs('qodrat', this)">قسم القدرات</button>
                <button class="btn tab-main" onclick="toggleTabs('tahsili', this)">قسم التحصيلي</button>
                <button class="btn tab-main" style="border-color: #555; color: #555;">طباعة المحتوى 🖨️</button>
            </div>

            <div id="qodrat-sub" class="sub-tabs-box">
                <a href="#" class="btn btn-sub">الكمي</a>
                <a href="#" class="btn btn-sub">اللفظي</a>
            </div>

            <div id="tahsili-sub" class="sub-tabs-box">
                <a href="#" class="btn btn-sub">الرياضيات</a>
                <a href="#" class="btn btn-sub">الأحياء</a>
                <a href="#" class="btn btn-sub">الكيمياء</a>
                <a href="#" class="btn btn-sub">الفيزياء</a>
            </div>

            <div class="row g-4 mt-5">
                <div class="col-md-4">
                    <div class="stat-card">
                        <h1 class="fw-bold text-primary">5</h1>
                        <p class="text-muted fw-bold mb-0">اختبارات محاكية ⏱️</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <h1 class="fw-bold text-primary">120</h1>
                        <p class="text-muted fw-bold mb-0">عدد الأمثلة 📝</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <h1 class="fw-bold text-primary">25</h1>
                        <p class="text-muted fw-bold mb-0">عدد الدروس 📘</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    {% include "core/footer.html" %}

    <script>
        function toggleTabs(section, btn) {
            document.getElementById('qodrat-sub').style.display = 'none';
            document.getElementById('tahsili-sub').style.display = 'none';
            document.querySelectorAll('.tab-main').forEach(b => b.classList.remove('active'));
            document.getElementById(section + '-sub').style.display = 'block';
            btn.classList.add('active');
        }
    </script>
</body>
</html>
