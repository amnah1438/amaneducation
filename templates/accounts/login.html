<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — منصة آمنة التعليمية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0d5c35 0%, #1a4a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { font-size: 1.4rem; font-weight: 900; color: #1a7a4a; margin-bottom: 4px; }
    .logo p { font-size: 0.85rem; color: #888; }

    /* تبويبات نوع الدخول */
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tab {
      flex: 1; padding: 10px;
      border-radius: 10px; border: 2px solid #e4e4e4;
      background: #f5f7fa; cursor: pointer;
      text-align: center; font-family: 'Cairo', sans-serif;
      font-size: 0.88rem; font-weight: 700; color: #666;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #1a7a4a, #1a4a8a);
      color: white; border-color: transparent;
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-weight: 700;
      font-size: 0.88rem; color: #333; margin-bottom: 6px;
    }
    .form-input {
      width: 100%; padding: 12px 16px;
      border: 2px solid #e4e4e4; border-radius: 10px;
      font-family: 'Cairo', sans-serif; font-size: 0.95rem;
      transition: border-color 0.2s; outline: none;
    }
    .form-input:focus { border-color: #1a7a4a; }
    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #1a7a4a, #1a4a8a);
      color: white; border: none; border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.9; }
    .error {
      background: #fde8e8; color: #e74c3c;
      padding: 10px 14px; border-radius: 8px;
      font-size: 0.85rem; margin-bottom: 16px;
      border-right: 4px solid #e74c3c;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <h1>🎓 منصة آمنة التعليمية</h1>
      <p>اختاري نوع الدخول</p>
    </div>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <!-- تبويبات -->
    <div class="tabs">
      <!-- type=button: نمنع الإرسال غير المقصود للنموذج إذا وُضعت داخل <form>. -->
      <button type="button" class="tab active" onclick="switchTab(event,'admin')">🏫 المديرة</button>
      <button type="button" class="tab" onclick="switchTab(event,'id')">👩‍🏫 معلمة / طالبة</button>
    </div>

    <!-- دخول المديرة -->
    <div class="form-section active" id="form-admin">
      <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="login_type" value="admin">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" name="username" class="form-input" placeholder="اسم المستخدم" autofocus>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" name="password" class="form-input" placeholder="كلمة المرور">
        </div>
        <button type="submit" class="btn-login">دخول ←</button>
      </form>
    </div>

    <!-- دخول المعلمة / الطالبة -->
    <div class="form-section" id="form-id">
      <form method="POST" autocomplete="off">
        {% csrf_token %}
        <input type="hidden" name="login_type" value="id">
        <div class="form-group">
          <label>رقم الهوية</label>
          <!--
            inputmode + pattern: يفتح لوحة الأرقام على الجوال ويمنع الأحرف.
            maxlength=12: حماية من قيم عملاقة.
          -->
          <input type="text" name="national_id" class="form-input"
                 inputmode="numeric" pattern="[0-9]{8,12}" maxlength="12"
                 required placeholder="أدخلي رقم هويتك">
        </div>
        <div class="form-group">
          <label>رمز التحقق (PIN)</label>
          <!--
            type=password يخفي الرمز عن العيون. autocomplete=current-password
            يسمح للمتصفح بحفظه إن رغبت الطالبة.
          -->
          <input type="password" name="pin_code" class="form-input"
                 inputmode="numeric" autocomplete="current-password"
                 maxlength="32" required placeholder="رمز PIN أو رقم الهوية">
        </div>
        <p style="font-size:0.78rem;color:#888;margin-bottom:12px;line-height:1.6">
          إن لم يُمنح لكِ رمز PIN بعد، استخدمي رقم هويتك ككلمة مرور مؤقتة، ثم اطلبي
          من المعلمة تحديث الرمز.
        </p>
        <button type="submit" class="btn-login">دخول ←</button>
      </form>
    </div>
  </div>

  <script>
    // نمرر event صراحةً لضمان العمل في strict mode وفي جميع المتصفحات.
    function switchTab(ev, type) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
      ev.currentTarget.classList.add('active');
      const form = document.getElementById('form-' + type);
      if (form) form.classList.add('active');
    }
  </script>
</body>
</html>
