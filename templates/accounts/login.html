<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — منصة آمنة التعليمية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0d5c35 0%, #1a4a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo h1 { font-size: 1.4rem; font-weight: 900; color: #1a7a4a; margin-bottom: 4px; }
    .logo p { font-size: 0.85rem; color: #888; }

    .tabs { display: flex; gap: 6px; margin-bottom: 22px; }
    .tab {
      flex: 1; padding: 10px 6px;
      border-radius: 10px; border: 2px solid #e4e4e4;
      background: #f5f7fa; cursor: pointer;
      text-align: center; font-family: 'Cairo', sans-serif;
      font-size: 0.82rem; font-weight: 700; color: #666;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #1a7a4a, #1a4a8a);
      color: white; border-color: transparent;
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-weight: 700;
      font-size: 0.88rem; color: #333; margin-bottom: 6px;
    }
    .form-input {
      width: 100%; padding: 12px 16px;
      border: 2px solid #e4e4e4; border-radius: 10px;
      font-family: 'Cairo', sans-serif; font-size: 0.95rem;
      transition: border-color 0.2s; outline: none;
    }
    .form-input:focus { border-color: #1a7a4a; }
    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #1a7a4a, #1a4a8a);
      color: white; border: none; border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 6px;
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.9; }
    .error {
      background: #fde8e8; color: #e74c3c;
      padding: 10px 14px; border-radius: 8px;
      font-size: 0.88rem; margin-bottom: 14px;
      border-right: 4px solid #e74c3c;
      font-weight: 600;
    }
    .info {
      background: #eef6ff; color: #1a4a8a;
      padding: 9px 12px; border-radius: 8px;
      font-size: 0.78rem; margin-bottom: 12px;
      line-height: 1.5;
      border-right: 3px solid #1a4a8a;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <h1>🎓 منصة آمنة التعليمية</h1>
      <p>اختاري نوع الدخول</p>
    </div>

    {% if error %}
      <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <!-- ثلاث تبويبات: مديرة / معلمة / طالبة -->
    <div class="tabs">
      <button type="button" class="tab" onclick="switchTab(event,'admin')">🏫 المديرة</button>
      <button type="button" class="tab" onclick="switchTab(event,'teacher')">👩‍🏫 معلمة</button>
      <button type="button" class="tab active" onclick="switchTab(event,'student')">👩‍🎓 طالبة</button>
    </div>

    <!-- ① طالبة — رقم الهوية فقط (الافتراضي للسهولة) -->
    <div class="form-section active" id="form-student">
      <form method="POST" autocomplete="off" onsubmit="return validateStudentId(this)">
        {% csrf_token %}
        <input type="hidden" name="login_type" value="student">
        <div class="info">
          🌸 الدخول للطالبة برقم الهوية الوطنية فقط (10 أرقام) — لا حاجة لكلمة مرور.
        </div>
        <div class="form-group">
          <label>رقم الهوية الوطنية (10 أرقام)</label>
          <input type="text" name="national_id" class="form-input"
                 inputmode="numeric"
                 maxlength="10"
                 minlength="10"
                 required placeholder="أدخلي رقم هويتك ١٠ أرقام" autofocus
                 oninput="this.value=this.value.replace(/\s+/g,'').slice(0,10)">
          <div id="student-id-counter" style="font-size:0.78rem;color:#888;margin-top:6px;text-align:left">0 / 10</div>
        </div>
        <button type="submit" class="btn-login">دخول ←</button>
      </form>
    </div>

    <script>
      // عدّاد أرقام مباشر + تحقق قبل الإرسال
      (function(){
        const inp = document.querySelector('#form-student input[name=national_id]');
        const counter = document.getElementById('student-id-counter');
        if (!inp || !counter) return;
        // تحويل الأرقام العربية والفارسية إلى لاتينية للعد فقط
        const _AR = '٠١٢٣٤٥٦٧٨٩';
        const _FA = '۰۱۲۳۴۵۶۷۸۹';
        function normalize(s){
          return [...s].map(ch => {
            const a = _AR.indexOf(ch); if (a !== -1) return String(a);
            const f = _FA.indexOf(ch); if (f !== -1) return String(f);
            return ch;
          }).join('');
        }
        inp.addEventListener('input', () => {
          const n = normalize(inp.value).replace(/\D/g,'').length;
          counter.textContent = n + ' / 10';
          counter.style.color = (n === 10) ? '#0d5c35' : '#888';
        });
      })();
      function validateStudentId(form){
        const v = form.national_id.value;
        const _AR = '٠١٢٣٤٥٦٧٨٩';
        const _FA = '۰۱۲۳۴۵۶۷۸۹';
        const norm = [...v].map(ch => {
          const a = _AR.indexOf(ch); if (a !== -1) return String(a);
          const f = _FA.indexOf(ch); if (f !== -1) return String(f);
          return ch;
        }).join('').replace(/\D/g,'');
        if (norm.length !== 10) {
          alert('رقم الهوية الوطنية يجب أن يكون 10 أرقام بالضبط');
          return false;
        }
        return true;
      }
    </script>

    <!-- ② معلمة — رقم الهوية + PIN -->
    <div class="form-section" id="form-teacher">
      <form method="POST" autocomplete="off">
        {% csrf_token %}
        <input type="hidden" name="login_type" value="teacher">
        <div class="form-group">
          <label>رقم الهوية</label>
          <input type="text" name="national_id" class="form-input"
                 inputmode="numeric" pattern="[0-9]{8,12}" maxlength="12"
                 required placeholder="أدخلي رقم هويتك">
        </div>
        <div class="form-group">
          <label>رمز التحقق (PIN)</label>
          <input type="password" name="pin_code" class="form-input"
                 inputmode="numeric" autocomplete="current-password"
                 maxlength="32" required placeholder="رمز PIN أو رقم الهوية">
        </div>
        <p style="font-size:0.78rem;color:#888;margin-bottom:10px;line-height:1.6">
          إن لم يُمنح لكِ رمز PIN بعد، استخدمي رقم هويتك ككلمة مرور مؤقتة.
        </p>
        <button type="submit" class="btn-login">دخول ←</button>
      </form>
    </div>

    <!-- ③ المديرة — اسم مستخدم + كلمة مرور -->
    <div class="form-section" id="form-admin">
      <form method="POST" autocomplete="off">
        {% csrf_token %}
        <input type="hidden" name="login_type" value="admin">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" name="username" class="form-input" placeholder="اسم المستخدم">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" name="password" class="form-input" placeholder="كلمة المرور">
        </div>
        <button type="submit" class="btn-login">دخول ←</button>
      </form>
    </div>
  </div>

  <script>
    function switchTab(ev, type) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
      ev.currentTarget.classList.add('active');
      const form = document.getElementById('form-' + type);
      if (form) {
        form.classList.add('active');
        const firstInput = form.querySelector('input:not([type=hidden])');
        if (firstInput) firstInput.focus();
      }
    }
  </script>
</body>
</html>
