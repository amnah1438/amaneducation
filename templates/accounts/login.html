<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — منصة آمنة التعليمية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0d5c35 0%, #1a4a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { font-size: 1.4rem; font-weight: 900; color: #1a7a4a; margin-bottom: 4px; }
    .logo p { font-size: 0.85rem; color: #888; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-weight: 700;
      font-size: 0.88rem; color: #333;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%; padding: 12px 16px;
      border: 2px solid #e4e4e4;
      border-radius: 10px; font-family: 'Cairo', sans-serif;
      font-size: 0.95rem; transition: border-color 0.2s;
      outline: none;
    }
    .form-input:focus { border-color: #1a7a4a; }
    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #1a7a4a, #1a4a8a);
      color: white; border: none; border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.9; }
    .error {
      background: #fde8e8; color: #e74c3c;
      padding: 10px 14px; border-radius: 8px;
      font-size: 0.85rem; margin-bottom: 16px;
      border-right: 4px solid #e74c3c;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <h1>🎓 منصة آمنة التعليمية</h1>
      <p>سجّلي دخولك للمتابعة</p>
    </div>

    {% if form.non_field_errors %}
      <div class="error">{{ form.non_field_errors }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" name="username" class="form-input" placeholder="اسم المستخدم" autofocus>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" name="password" class="form-input" placeholder="كلمة المرور">
      </div>
      <button type="submit" class="btn-login">دخول ←</button>
    </form>
  </div>
</body>
</html>
