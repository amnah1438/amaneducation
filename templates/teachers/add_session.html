<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل حصة — منصة آمنة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f4f6fa; padding: 24px; margin: 0; }
    .card { background: #fff; max-width: 600px; margin: 40px auto; padding: 32px; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
    h1 { margin: 0 0 18px; color: #1a4a8a; font-size: 1.3rem; }
    .row { margin-bottom: 16px; }
    label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.9rem; color: #333; }
    input, select, textarea { width: 100%; padding: 12px; border: 2px solid #e4e4e4; border-radius: 10px; font-family: inherit; font-size: 0.95rem; }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #1a7a4a; }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-family: inherit; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
    .btn-primary { background: linear-gradient(135deg, #1a7a4a, #1a4a8a); color: #fff; }
    .btn-secondary { background: #f4f6fa; color: #555; text-decoration: none; text-align: center; line-height: 28px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📅 تسجيل حصة جديدة</h1>

    <form method="POST">
      {% csrf_token %}

      <div class="row">
        <label for="skill_id">المهارة / الدرس:</label>
        <select id="skill_id" name="skill_id" required>
          <option value="">— اختاري —</option>
          {% for s in skills %}
            <option value="{{ s.id }}">{{ s.title }} ({{ s.get_content_type_display }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="row">
        <label for="session_type">نوع الحصة:</label>
        <select id="session_type" name="session_type">
          <option value="qodrat">قدرات</option>
          <option value="tahsili">تحصيلي</option>
          <option value="both">قدرات + تحصيلي</option>
        </select>
      </div>

      <div class="row">
        <label for="target_class">الفصل:</label>
        <input id="target_class" name="target_class" type="text" required placeholder="مثال: ثالث ثانوي 1">
      </div>

      <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <label for="session_date">التاريخ:</label>
          <input id="session_date" name="session_date" type="date" required>
        </div>
        <div>
          <label for="session_time">الوقت:</label>
          <input id="session_time" name="session_time" type="time" required>
        </div>
      </div>

      <div class="row">
        <label for="notes">ملاحظات:</label>
        <textarea id="notes" name="notes" placeholder="اختياري"></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">تسجيل الحصة</button>
        <a class="btn btn-secondary" href="{% url 'teacher_dashboard' %}">إلغاء</a>
      </div>
    </form>
  </div>
</body>
</html>
