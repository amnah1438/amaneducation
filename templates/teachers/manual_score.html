<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رصد الدرجات يدوياً — منصة آمنة التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="dark"] {
  --bg:#0a0d14;--bg2:#0f1320;--bg3:#141928;
  --card:#111827;--card2:#1a2235;
  --border:#1e2a3d;--border2:#263245;
  --green:#10b981;--green2:#065f46;
  --blue:#3b82f6;--blue2:#1e3a5f;
  --purple:#8b5cf6;--purple2:#4c1d95;
  --orange:#f59e0b;--orange2:#78350f;
  --red:#ef4444;--red2:#7f1d1d;
  --teal:#14b8a6;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#475569;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:9px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--green),var(--blue));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-name{font-size:12px;font-weight:800}
.back-link{color:var(--text3);font-size:11px;text-decoration:none;padding:5px 10px;border-radius:6px;transition:all 0.2s}
.back-link:hover{background:var(--bg3);color:var(--text2)}

.main{max-width:560px;margin:0 auto;padding:24px 16px}

.page-title{font-size:18px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:8px}

.msg{padding:9px 12px;border-radius:7px;font-size:11px;margin-bottom:14px;border-right:3px solid;display:flex;align-items:center;gap:7px}
.msg-s{background:rgba(16,185,129,0.08);border-color:var(--green);color:#6ee7a0}
.msg-e{background:rgba(239,68,68,0.08);border-color:var(--red);color:#fca5a5}

.form-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}

.step{margin-bottom:18px}
.step:last-child{margin-bottom:0}
.step-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px}
.step-num{width:20px;height:20px;background:var(--blue2);color:var(--blue);border:1px solid rgba(59,130,246,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}

select, input[type="number"]{
  width:100%;background:var(--card2);border:1px solid var(--border2);color:var(--text);
  font-family:'Tajawal',sans-serif;font-size:12px;padding:10px 12px;border-radius:8px;outline:none;
  transition:border-color 0.2s;
}
select:focus, input[type="number"]:focus{border-color:var(--blue)}
select{cursor:pointer}

.score-row{display:flex;gap:10px;align-items:center}
.score-row .field{flex:1}
.score-row .field label{display:block;font-size:10px;color:var(--text3);margin-bottom:4px}
.score-divider{color:var(--text3);font-size:16px;font-weight:700;padding-top:18px}

.btn-submit{
  width:100%;margin-top:20px;padding:12px;border-radius:8px;border:none;
  background:linear-gradient(135deg,var(--green2),var(--blue2));color:white;
  border:1px solid var(--green);font-family:'Tajawal',sans-serif;font-size:13px;
  font-weight:700;cursor:pointer;transition:all 0.2s;
}
.btn-submit:hover{filter:brightness(1.15)}
.btn-submit:disabled{opacity:0.4;cursor:not-allowed}

.hint{font-size:10px;color:var(--text3);margin-top:4px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-mark">أ</div>
    <div class="logo-name">منصة آمنة التعليمية</div>
  </div>
  <a href="/teachers/dashboard/" class="back-link">← لوحة التحكم</a>
</div>

<div class="main">
  <div class="page-title">📝 رصد الدرجات يدوياً</div>

  {% if messages %}
    {% for message in messages %}
      <div class="msg {% if message.tags == 'success' %}msg-s{% else %}msg-e{% endif %}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="POST" class="form-card" id="scoreForm">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">

    <div class="step">
      <div class="step-label"><span class="step-num">1</span> اختاري الفصل</div>
      <select id="classroomSelect" required>
        <option value="">— اختاري الفصل —</option>
        {% for classroom in classrooms %}
          <option value="{{ classroom.id }}">{{ classroom.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="step">
      <div class="step-label"><span class="step-num">2</span> اختاري الطالبة</div>
      <select name="student_id" id="studentSelect" required disabled>
        <option value="">— اختاري الفصل أولاً —</option>
      </select>
    </div>

    <div class="step">
      <div class="step-label"><span class="step-num">3</span> اختاري الاختبار</div>
      <select name="exam_id" id="examSelect" required>
        <option value="">— اختاري الاختبار —</option>
        {% for exam in exams %}
          <option value="{{ exam.id }}" data-total="{{ exam.questions_count }}">{{ exam.skill.title }} — {{ exam.get_exam_type_display }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="step">
      <div class="step-label"><span class="step-num">4</span> الدرجة</div>
      <div class="score-row">
        <div class="field">
          <label for="scoreInput">الدرجة المحصّلة</label>
          <input type="number" name="score" id="scoreInput" min="0" step="0.5" required placeholder="0">
        </div>
        <div class="score-divider">/</div>
        <div class="field">
          <label for="totalInput">الدرجة الكاملة</label>
          <input type="number" id="totalInput" readonly tabindex="-1" placeholder="—">
        </div>
      </div>
      <div class="hint">سيتم تعبئة الدرجة الكاملة تلقائياً عند اختيار الاختبار</div>
    </div>

    <button type="submit" class="btn-submit">رصد الدرجة</button>
  </form>
</div>

<script>
const classroomSelect = document.getElementById('classroomSelect');
const studentSelect = document.getElementById('studentSelect');
const examSelect = document.getElementById('examSelect');
const scoreInput = document.getElementById('scoreInput');
const totalInput = document.getElementById('totalInput');

classroomSelect.addEventListener('change', function() {
  const cid = this.value;
  studentSelect.innerHTML = '<option value="">— جارٍ التحميل... —</option>';
  studentSelect.disabled = true;

  if (!cid) {
    studentSelect.innerHTML = '<option value="">— اختاري الفصل أولاً —</option>';
    return;
  }

  fetch('/teachers/classrooms/' + cid + '/students/')
    .then(r => r.json())
    .then(data => {
      studentSelect.innerHTML = '<option value="">— اختاري الطالبة —</option>';
      (data.students || []).forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        studentSelect.appendChild(opt);
      });
      studentSelect.disabled = false;
    })
    .catch(() => {
      studentSelect.innerHTML = '<option value="">— حدث خطأ —</option>';
    });
});

examSelect.addEventListener('change', function() {
  const selected = this.options[this.selectedIndex];
  const total = selected.getAttribute('data-total');
  if (total) {
    totalInput.value = total;
    scoreInput.max = total;
  } else {
    totalInput.value = '';
    scoreInput.removeAttribute('max');
  }
});
</script>

</body>
</html>
