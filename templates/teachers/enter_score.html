<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رصد درجة يدوية — منصة آمنة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f4f6fa; padding: 24px; margin: 0; }
    .card { background: #fff; max-width: 520px; margin: 40px auto; padding: 32px; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
    h1 { margin: 0 0 18px; color: #1a4a8a; font-size: 1.3rem; }
    label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.9rem; color: #333; }
    input[type=number] { width: 100%; padding: 12px; border: 2px solid #e4e4e4; border-radius: 10px; font-family: inherit; font-size: 1rem; }
    input:focus { outline: none; border-color: #1a7a4a; }
    .info { background: #f0f4f8; padding: 12px; border-radius: 10px; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.8; }
    .actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-family: inherit; font-weight: 700; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #1a7a4a, #1a4a8a); color: #fff; }
    .btn-secondary { background: #f4f6fa; color: #555; text-decoration: none; text-align: center; line-height: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📝 رصد درجة يدوية</h1>
    <div class="info">
      <strong>الطالبة:</strong> {{ result.student.get_full_name|default:result.student.username }}<br>
      <strong>الاختبار:</strong> {{ result.exam.skill.title }} — {{ result.exam.get_exam_type_display }}<br>
      <strong>الدرجة الكاملة:</strong> {{ result.total }}<br>
      <strong>درجة النجاح:</strong> {{ result.exam.pass_score }}%
    </div>

    <form method="POST">
      {% csrf_token %}
      <label for="score">الدرجة (من 0 إلى {{ result.total }}):</label>
      <input id="score" name="score" type="number" min="0" max="{{ result.total }}" step="0.5"
             value="{{ result.score }}" required>

      <div class="actions">
        <button type="submit" class="btn btn-primary">حفظ الدرجة</button>
        <a class="btn btn-secondary" href="{% url 'student_result' result.id %}">إلغاء</a>
      </div>
    </form>
  </div>
</body>
</html>
