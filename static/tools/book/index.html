<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كتاب معادلات الجمع والطرح التفاعلي</title>
<style>
@font-face{font-family:Tajawal;src:url(../../vendor/fonts/Tajawal-Regular.ttf);font-weight:400}
@font-face{font-family:Tajawal;src:url(../../vendor/fonts/Tajawal-Bold.ttf);font-weight:700}
:root{--glass:rgba(255,255,255,.74);--glass-b:rgba(255,255,255,.7);--ink:#1d2730;--mute:#5b6a74;--pri:#6b4de0;--ok:#1f9a5a;--bad:#d6455d;--acc:#e0922d;--shadow:0 10px 34px rgba(20,30,40,.22);color-scheme:light}
body.night{--glass:rgba(24,32,38,.72);--glass-b:rgba(255,255,255,.14);--ink:#eaf1f4;--mute:#a4b3bb;--pri:#a592ff;--ok:#52d08c;--bad:#ff7f93;--acc:#f3b45f;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#cfc3ad;font-family:Tajawal,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none}
body.night{background:#1a2126}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#gl.drag{cursor:grabbing}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(30,25,15,.28) 100%)}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:var(--shadow)}
/* البطاقة */
#card{position:fixed;top:18px;right:18px;width:min(390px,calc(100vw - 36px));border-radius:20px;padding:16px 20px 16px;z-index:5;transition:opacity .35s,transform .35s}
#card.swap{opacity:0;transform:translateY(-8px)}
#card .tag{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--bad);margin-bottom:4px}
#card .tag.eq{color:var(--pri)}#card .tag.ok{color:var(--ok)}#card .tag.why{color:var(--acc)}
#card h2{font-size:21px;line-height:1.45;font-weight:700;margin-bottom:6px}
#card p{font-size:16px;line-height:1.7;color:var(--ink)}
#card p b{color:var(--pri)}
#card .opts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.opt,.act{font:inherit;font-weight:700;font-size:16px;text-align:right;padding:9px 14px;border-radius:12px;border:1.5px solid rgba(120,130,140,.35);background:rgba(255,255,255,.5);color:var(--ink);cursor:pointer;transition:.18s}
body.night .opt,body.night .act{background:rgba(255,255,255,.07)}
.opt:hover,.act:hover{border-color:var(--pri);transform:translateY(-1px)}
.opt.good{background:rgba(31,154,90,.18);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:rgba(214,69,93,.14);border-color:var(--bad);color:var(--bad);animation:shake .4s}
.act{background:var(--pri);color:#fff;border-color:transparent;text-align:center;margin-top:10px}
.act.alt{background:transparent;color:var(--ink);border-color:rgba(120,130,140,.4)}
.row2{display:flex;gap:8px}.row2 .act{flex:1}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#card .eqbox{margin:8px 0 2px;padding:8px 12px;border-radius:12px;background:rgba(107,77,224,.1);font-size:19px;font-weight:700;text-align:center;line-height:1.8}
/* المعادلة الحيّة */
#eqchip{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:4;padding:8px 22px;border-radius:40px;font-size:30px;font-weight:700;display:flex;align-items:center;gap:14px;white-space:nowrap}
#eqchip .eq{display:inline-flex;direction:rtl;align-items:center}
.t{display:inline-block;direction:ltr;unicode-bidi:isolate;margin:0 .14em}
.x{color:var(--pri)}.g{color:var(--ok)}.r{color:var(--bad)}
#eqchip .st{font-size:15px;color:var(--mute);font-weight:700}
#eqchip.warn{outline:2px solid var(--bad)}#eqchip.good{outline:2px solid var(--ok)}
/* الشريط السفلي */
#bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:6;border-radius:40px;padding:7px 12px;display:flex;align-items:center;gap:4px;width:min(660px,calc(100vw - 20px))}
#bar button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none;transition:.15s}
#bar button:hover{background:rgba(120,130,140,.22)}
#bar button:disabled{opacity:.3;cursor:default}
#bar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar .mid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 8px}
#bar .ttl{flex:1;font-size:15px;font-weight:700;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dots{display:flex;gap:5px;flex:none}
#dots i{width:7px;height:7px;border-radius:4px;background:rgba(120,130,140,.45);transition:.25s}
#dots i.on{width:22px;background:var(--pri)}
#bar button.on{background:var(--pri);color:#fff}
/* القائمة */
#menu{position:fixed;top:0;bottom:0;right:0;width:min(340px,86vw);z-index:9;padding:22px 20px;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);border-radius:22px 0 0 22px;overflow:auto}
#menu.open{transform:none}
#menu h3{font-size:22px;margin-bottom:4px}
#menu .sub{font-size:14px;color:var(--mute);margin-bottom:14px}
#menu a{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:12px;cursor:pointer;font-size:17px;font-weight:700}
#menu a:hover,#menu a.cur{background:rgba(107,77,224,.14)}
#menu a i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
#menu .cr{margin-top:20px;padding-top:14px;border-top:1px solid rgba(120,130,140,.3);font-size:14px;line-height:1.9;color:var(--mute)}
#menu .cr b{color:var(--ink)}
/* التلميح */
#hand{position:fixed;z-index:3;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;pointer-events:none;border:3px solid rgba(255,255,255,.95);background:rgba(255,255,255,.28);box-shadow:0 0 0 0 rgba(107,77,224,.5);animation:pulse 1.5s infinite;display:none}
#hand svg{position:absolute;left:30px;top:30px;width:34px;height:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(107,77,224,.55);transform:scale(.92)}70%{box-shadow:0 0 0 22px rgba(107,77,224,0);transform:scale(1.04)}100%{box-shadow:0 0 0 0 rgba(107,77,224,0);transform:scale(.92)}}
#tip{position:fixed;z-index:3;padding:6px 14px;border-radius:12px;font-size:16px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .25s;transform:translate(-50%,-130%);white-space:nowrap}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#e9e1d0;font-size:22px;font-weight:700;color:#5b4b2b;transition:opacity .6s}
@media (max-width:640px){
  #card{top:10px;right:10px;padding:12px 14px}#card h2{font-size:18px}#card p{font-size:14.5px}
  #eqchip{font-size:22px;bottom:84px;padding:6px 16px}
  #bar .ttl{display:none}
}
</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.min.js"}}</script>
</head>
<body>
<div id="loading">جارٍ فتح الكتاب…</div>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="card" class="glass"></div>
<div id="eqchip" class="glass"><span class="eq" id="eq"></span><span class="st" id="st"></span></div>
<div id="hand"><svg viewBox="0 0 24 24" fill="#fff" stroke="#333" stroke-width="1.2"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10l1.2-.3a1.4 1.4 0 0 1 1.7 1.2l.1.3 1.1-.2a1.4 1.4 0 0 1 1.6 1.3L18 15c0 3.5-2 6-5.5 6-2.4 0-3.8-1-5-2.7L4.7 14a1.4 1.4 0 0 1 2.1-1.8L9 14z"/></svg></div>
<div id="tip" class="glass"></div>
<nav id="bar" class="glass" aria-label="التحكم">
  <button id="bMenu" title="الفهرس"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button id="bPrev" title="السابق"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button id="bPlay" title="جولة تلقائية"><svg id="icPlay" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg></button>
  <div class="mid"><div class="ttl" id="ttl"></div><div id="dots"></div></div>
  <button id="bNext" title="التالي"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button id="bSound" title="الصوت"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
  <button id="bTheme" title="ليلي / نهاري"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  <button id="bFull" title="ملء الشاشة"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>
<aside id="menu" class="glass">
  <h3>الدرس ٣ - ٢</h3><div class="sub">معادلات الجمع والطرح · كتاب تفاعلي</div>
  <div id="menuList"></div>
  <div class="cr"><b>تصميم الطالب:</b> يوسف فايز العنزي<br><b>إشراف المعلم:</b> حمود غصن العنزي</div>
</aside>

<script type="module">
import * as THREE from 'three';

/* ====================== أدوات عامة ====================== */
const $ = s => document.querySelector(s);
const AR = v => String(v).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]).replace(/-/g, '−');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
await Promise.all(['400 30px Tajawal', '700 30px Tajawal'].map(f => document.fonts.load(f).catch(() => 0)));

/* ====================== المشهد ====================== */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, .1, 120);

const hemi = new THREE.HemisphereLight(0xfff2dc, 0x7f95a0, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d6, 2.3);
sun.position.set(-7, 13, 9); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 9, bottom: -9, near: 1, far: 40 });
sun.shadow.bias = -.0005; sun.shadow.radius = 5; sun.shadow.normalBias = .02;
scene.add(sun);

/* ---------- خامات ---------- */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const rng = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const hatch = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(70,70,80,.16)'; g.lineWidth = 1;
  for (let i = -h; i < w; i += 7) { g.beginPath(); g.moveTo(i, h); g.lineTo(i + h, 0); g.stroke(); }
}, [2, 2]);
const woodTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#d4c7ae'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    const y = rng() * h; g.strokeStyle = `rgba(${110 + rng() * 40},${90 + rng() * 30},${60 + rng() * 25},${.05 + rng() * .1})`;
    g.lineWidth = .6 + rng() * 2.2; g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= w; x += 64) g.lineTo(x, y + Math.sin(x * .01 + i) * 3 + (rng() - .5) * 2); g.stroke();
  }
}, [3, 2]);
const stripeTex = canvasTex(512, 512, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.fillStyle = 'rgba(50,50,40,.5)';
  for (let i = 0; i < 4; i++) { g.save(); g.translate(60 + i * 130, 0); g.rotate(-.35); g.fillRect(0, -100, 52 + i * 8, h + 300); g.restore(); }
});

const labelCache = new Map();
function labelTex(txt, { bg = '#fff', fg = '#222', size = 150, bold = true, w = 256, h = 256, ring } = {}) {
  const k = [txt, bg, fg, size, w, h, ring].join('|');
  if (labelCache.has(k)) return labelCache.get(k);
  const t = canvasTex(w, h, (g) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(70,70,80,.12)';
    for (let i = -h; i < w; i += 9) { g.fillRect(i, 0, 1.4, 1); g.save(); g.strokeStyle = 'rgba(60,60,70,.12)'; g.beginPath(); g.moveTo(i, h); g.lineTo(i + h, 0); g.stroke(); g.restore(); }
    if (ring) { g.strokeStyle = ring; g.lineWidth = 8; g.strokeRect(10, 10, w - 20, h - 20); }
    g.fillStyle = fg; g.font = `${bold ? 700 : 400} ${size}px Tajawal`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl';
    g.fillText(txt, w / 2, h / 2 + size * .06);
  });
  labelCache.set(k, t); return t;
}

/* ---------- حدود "رسم القلم" ---------- */
const LINE = new THREE.LineBasicMaterial({ color: 0x3b3b46, transparent: true, opacity: .78 });
function outline(mesh, geo, thr = 28) {
  const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo, thr), LINE);
  l.raycast = () => { }; mesh.add(l); return l;
}
const paperMat = (c = 0xf4f0e6) => new THREE.MeshStandardMaterial({ color: c, roughness: .95, map: hatch });
function box(w, h, d, mat, castS = true) {
  const g = new THREE.BoxGeometry(w, h, d), m = new THREE.Mesh(g, mat);
  m.castShadow = castS; m.receiveShadow = true; outline(m, g); return m;
}

/* ====================== المكتب والكتاب ====================== */
const desk = new THREE.Mesh(new THREE.PlaneGeometry(70, 46), new THREE.MeshStandardMaterial({ map: woodTex, roughness: .9, color: 0xffffff }));
desk.rotation.x = -Math.PI / 2; desk.position.y = -.62; desk.receiveShadow = true; scene.add(desk);
const mat = new THREE.Mesh(new THREE.PlaneGeometry(26, 15.5), new THREE.MeshStandardMaterial({ color: 0x9db5a9, roughness: 1 }));
mat.rotation.x = -Math.PI / 2; mat.position.y = -.6; mat.receiveShadow = true; scene.add(mat);
const stripes = new THREE.Mesh(new THREE.PlaneGeometry(40, 26), new THREE.MeshBasicMaterial({ map: stripeTex, transparent: true, opacity: .13, depthWrite: false }));
stripes.rotation.x = -Math.PI / 2; stripes.position.y = -.58; scene.add(stripes);

const book = new THREE.Group(); scene.add(book);
const cover = box(10.7, .34, 7.6, new THREE.MeshStandardMaterial({ color: 0xd9a826, roughness: .7 }));
cover.position.y = -.43; book.add(cover);
const PW = 5, PD = 7;
const pageBlockL = box(PW, .3, PD, paperMat(), true); pageBlockL.position.set(-PW / 2, -.12, 0); book.add(pageBlockL);
const pageBlockR = box(PW, .3, PD, paperMat(), true); pageBlockR.position.set(PW / 2, -.12, 0); book.add(pageBlockR);
const pageTopY = .03 + .001;
function pagePlane(x) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(PW - .04, PD - .04), new THREE.MeshStandardMaterial({ roughness: .95 }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, pageTopY + .002, 0); m.receiveShadow = true; book.add(m); return m;
}
const planeL = pagePlane(-PW / 2), planeR = pagePlane(PW / 2);
// خطّ الغلاف الذهبي + شريط الصفحة
const ribbon = box(.12, .05, 7.6, new THREE.MeshStandardMaterial({ color: 0x2b3f6b, roughness: .8 })); ribbon.position.set(0, .03, .3); book.add(ribbon);

function wrap(g, text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function paperBase(g, w, h, gutterSide) {
  g.fillStyle = '#f7f3e7'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(120,100,60,${rng() * .05})`; g.fillRect(rng() * w, rng() * h, 1 + rng() * 2, 1 + rng() * 2); }
  const gr = gutterSide === 'left' ? g.createLinearGradient(0, 0, 150, 0) : g.createLinearGradient(w, 0, w - 150, 0);
  gr.addColorStop(0, 'rgba(60,45,20,.34)'); gr.addColorStop(1, 'rgba(60,45,20,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
}
function textPageTex(c) {
  return canvasTex(1024, 1434, (g, w, h) => {
    paperBase(g, w, h, 'left');
    g.textBaseline = 'alphabetic'; g.direction = 'rtl'; g.textAlign = 'right';
    const R = w - 78, W = w - 200;
    g.fillStyle = '#9a8f78'; g.font = '700 26px Tajawal'; g.fillText('الفصل ٣ · الجبر: المعادلات الخطية', R, 84);
    g.fillStyle = '#c0392b'; g.font = '700 26px Tajawal'; g.fillText(c.kicker || 'الدرس ٣ - ٢', R, 124);
    g.fillStyle = '#23303a'; g.font = '700 62px Tajawal'; let y = 206;
    wrap(g, c.title, W).forEach(l => { g.fillText(l, R, y); y += 76; });
    y += 8; g.font = '400 33px Tajawal'; g.fillStyle = '#3a4650';
    (c.paras || []).forEach(p => { wrap(g, p, W).forEach(l => { g.fillText(l, R, y); y += 52; }); y += 14; });
    if (c.formula) {
      g.fillStyle = 'rgba(107,77,224,.09)'; g.fillRect(78, y, w - 156, 118);
      g.strokeStyle = 'rgba(107,77,224,.45)'; g.lineWidth = 2; g.strokeRect(78, y, w - 156, 118);
      g.fillStyle = '#4b34b8'; g.font = '700 56px Tajawal'; g.textAlign = 'center'; g.direction = 'ltr';
      g.fillText(c.formula, w / 2, y + 80); g.textAlign = 'right'; g.direction = 'rtl'; y += 160;
    }
    if (c.sub) { g.fillStyle = '#6a7680'; g.font = '400 29px Tajawal'; (c.sub).forEach(s => { wrap(g, s, W).forEach(l => { g.fillText(l, R, y); y += 44; }); }); y += 10; }
    if (c.checks) { c.checks.forEach(s => { g.strokeStyle = '#7a8790'; g.lineWidth = 2.5; g.strokeRect(R - 30, y - 28, 30, 30); g.fillStyle = '#3a4650'; g.font = '400 32px Tajawal'; g.fillText(s, R - 50, y); y += 52; }); }
    g.fillStyle = '#9a8f78'; g.font = '400 24px Tajawal'; g.textAlign = 'left'; g.fillText(AR(103 + (c.n || 0)), 80, h - 52);
  });
}
function leftPageTex(cap) {
  return canvasTex(1024, 1434, (g, w, h) => {
    paperBase(g, w, h, 'right');
    g.strokeStyle = 'rgba(120,130,140,.18)'; g.lineWidth = 1.5; g.setLineDash([6, 8]);
    g.strokeRect(70, 70, w - 140, h - 150); g.setLineDash([]);
    g.fillStyle = '#7a8790'; g.font = '400 27px Tajawal'; g.textAlign = 'right'; g.direction = 'rtl'; g.textBaseline = 'alphabetic';
    let y = h - 80; wrap(g, cap, w - 220).reverse().forEach(l => { g.fillText(l, w - 90, y); y -= 38; });
    g.fillStyle = '#9a8f78'; g.font = '400 24px Tajawal'; g.textAlign = 'right'; g.fillText(AR(102), w - 80, h - 28 + 0);
  });
}

/* ====================== الميزان ثلاثي الأبعاد ====================== */
const stage = new THREE.Group(); stage.position.set(-PW / 2, .035, .1); book.add(stage);
const popup = new THREE.Group(); stage.add(popup);               // يُنبثق من الصفحة
// خلفية الورق المطوي
const back = box(4.7, 3.9, .05, paperMat(0xf1ede3)); back.position.set(0, 1.95, -1.6); popup.add(back);
const wing = box(.05, 3.3, 1.5, paperMat(0xebe6da)); wing.position.set(-2.34, 1.65, -.86); popup.add(wing);
const wing2 = box(.05, 3.3, 1.5, paperMat(0xebe6da)); wing2.position.set(2.34, 1.65, -.86); popup.add(wing2);
// أرضية
const floor = box(4.9, .08, 3.3, paperMat(0xf0ece1)); floor.position.set(0, .04, -.1); popup.add(floor);
const sbase = box(2.0, .22, 1.1, paperMat(0xefeadf)); sbase.position.set(0, .19, .1); popup.add(sbase);

let last = performance.now(), angle = 0, angVel = 0; const tmp = new THREE.Vector3();
